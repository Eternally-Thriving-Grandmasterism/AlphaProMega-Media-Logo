<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C872"/>
      <stop offset="50%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  <!-- Seven rays -->
  <g fill="url(#gold)">
    <path d="M120 10 L124 45 L116 45 Z"/>
    <path d="M95 25 L105 50 L90 45 Z"/>
    <path d="M145 25 L135 50 L150 45 Z"/>
    <path d="M75 45 L90 65 L80 60 Z"/>
    <path d="M165 45 L150 65 L160 60 Z"/>
    <path d="M60 70 L80 85 L70 80 Z"/>
    <path d="M180 70 L160 85 L170 80 Z"/>
  </g>
  <!-- Flowing alpha body -->
  <path d="M120 70
           C80 90, 40 160, 25 240
           C55 210, 80 170, 120 145
           C160 170, 185 210, 215 240
           C200 160, 160 90, 120 70 Z"
        fill="url(#gold)"/>
  <!-- Inner flow curve -->
  <path d="M70 180
           C100 160, 140 160, 170 180
           C150 210, 90 210, 70 180 Z"
        fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
</svg>
